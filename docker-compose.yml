services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: postgres://${DB_USER:-revgas}:${DB_PASSWORD:-revgas}@postgres:5432/${DB_NAME:-revgas}
      DB_SSL_MODE: disable
      CACHE_HOST: redis
      CACHE_PORT: 6379
      CACHE_URL: redis://redis:6379
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-revgas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-revgas}
      POSTGRES_DB: ${DB_NAME:-revgas}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${CACHE_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
